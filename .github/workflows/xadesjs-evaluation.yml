name: Evaluacion aislada XAdESjs (NO FISCAL)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-evaluation:
    name: XAdESjs 3.1.0 en Node ${{ matrix.node }} (no fiscal)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preparar directorios aislados y recoger versiones
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/xades-eval/results"
          node --version > "$RUNNER_TEMP/xades-eval/results/node-version.txt"
          npm --version >> "$RUNNER_TEMP/xades-eval/results/node-version.txt"
          cp tests/qa-082-xadesjs-evaluation.mjs "$RUNNER_TEMP/xades-eval/probe-082.mjs"
          cp tests/qa-083-xadesjs-epes-evaluation.mjs "$RUNNER_TEMP/xades-eval/probe-083.mjs"
          cp tests/qa-084-xadesjs-adapter-evaluation.mjs "$RUNNER_TEMP/xades-eval/probe-084.mjs"
          cp electron/fe-xades-specialized-lab.mjs "$RUNNER_TEMP/xades-eval/specialized-adapter.mjs"
      - name: Instalar versiones controladas en carpeta temporal (nunca en producción)
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/xades-eval" --save-exact --ignore-scripts --no-audit --no-fund \
            xadesjs@3.1.0 xmldsigjs@3.1.0 xml-core@3.1.0 @xmldom/xmldom@0.9.12 xpath@0.0.35
          npm ls --prefix "$RUNNER_TEMP/xades-eval" --depth=0 > "$RUNNER_TEMP/xades-eval/results/dependencias.txt"
      - name: Ensayo heredado de firma básica (v0.6.82)
        run: node "$RUNNER_TEMP/xades-eval/probe-082.mjs"
      - name: Tres XML ficticios con política EPES explícita y mutaciones
        env:
          FACTURACR_XADES_REPORT_DIR: ${{ runner.temp }}/xades-eval/results
        run: node "$RUNNER_TEMP/xades-eval/probe-083.mjs"
      - name: Comprobar adaptador especializado v0.6.84 (solo pruebas)
        env:
          FACTURACR_XADES_REPORT_DIR: ${{ runner.temp }}/xades-eval/results
        run: node "$RUNNER_TEMP/xades-eval/probe-084.mjs"
      - name: Instalar verificador independiente en entorno temporal
        run: python -m pip install --disable-pip-version-check 'lxml>=5,<7' 'cryptography>=42,<47'
      - name: Verificar las tres firmas con Python, sin reutilizar el firmador
        run: |
          python tests/qa-083-xadesjs-epes-independiente.py "$RUNNER_TEMP/xades-eval/results" 083
          python tests/qa-083-xadesjs-epes-independiente.py "$RUNNER_TEMP/xades-eval/results" 084
      - name: Asegurar que producción y lockfile permanecen intactos
        run: git diff --exit-code -- package.json package-lock.json
      - name: Publicar informe de evaluación
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: QA-XAdESjs-NO-FISCAL-node-${{ matrix.node }}
          path: ${{ runner.temp }}/xades-eval/results/
          if-no-files-found: warn
          retention-days: 14

  production-lockfile-candidate:
    name: Candidato de lockfile XAdESjs (NO FISCAL, no publicado)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Preparar manifiestos en una carpeta separada del proyecto
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/xades-candidate"
          cp package.json package-lock.json "$RUNNER_TEMP/xades-candidate/"
          cp electron/fe-xades-specialized-lab.mjs "$RUNNER_TEMP/xades-candidate/specialized-adapter.mjs"
          cp tests/qa-084-xadesjs-adapter-evaluation.mjs "$RUNNER_TEMP/xades-candidate/probe-084.mjs"
          mkdir -p "$RUNNER_TEMP/xades-candidate/results"
      - name: Generar candidato de lockfile reproducible SIN modificar producción
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/xades-candidate" --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund \
            xadesjs@3.1.0 xmldsigjs@3.1.0 xml-core@3.1.0 @xmldom/xmldom@0.9.12 xpath@0.0.35
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --prefix "$RUNNER_TEMP/xades-candidate" --ignore-scripts --no-audit --no-fund
          npm ls --prefix "$RUNNER_TEMP/xades-candidate" --depth=0 > "$RUNNER_TEMP/xades-candidate/results/dependencias.txt"
          cp "$RUNNER_TEMP/xades-candidate/package.json" "$RUNNER_TEMP/xades-candidate/results/package.candidato.json"
          cp "$RUNNER_TEMP/xades-candidate/package-lock.json" "$RUNNER_TEMP/xades-candidate/results/package-lock.candidato.json"
      - name: Ejecutar adaptador con dependencias candidatas reales
        env:
          FACTURACR_XADES_REPORT_DIR: ${{ runner.temp }}/xades-candidate/results
        run: node "$RUNNER_TEMP/xades-candidate/probe-084.mjs"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verificación criptográfica independiente de candidato
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'lxml>=5,<7' 'cryptography>=42,<47'
          python tests/qa-083-xadesjs-epes-independiente.py "$RUNNER_TEMP/xades-candidate/results" 084
      - name: Informe de auditoría de dependencias (NO presume ausencia de vulnerabilidades)
        shell: bash
        run: |
          npm audit --prefix "$RUNNER_TEMP/xades-candidate" --omit=dev --json > "$RUNNER_TEMP/xades-candidate/results/auditoria-npm.json" || true
          git diff --exit-code -- package.json package-lock.json
      - name: Publicar propuesta para REVISIÓN, no instalación automática
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: QA-XAdESjs-candidato-lockfile-node-22
          path: ${{ runner.temp }}/xades-candidate/results/
          if-no-files-found: warn
          retention-days: 14
