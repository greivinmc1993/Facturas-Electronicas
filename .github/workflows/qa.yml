name: QA FacturaCR

on:
  push:
  pull_request:

jobs:
  unit-integration-build:
    name: QA Node 22 + compilación React
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias sin descargar binario Electron
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Comprobar fixture version anterior
        run: node -e "require('node:fs').accessSync('tests/fixtures/FacturaCR_v0.6.34_baseline.zip')"
      - name: Cálculos, SQLite temporal, validaciones y sintaxis
        run: npm test
      - name: v0.6.93 cotejo orientativo de certificado y empresa (sin habilitar emisión)
        run: npm run qa:certificate-company
      - name: Contrato v0.6.92 de preparación de firma (solo XML ficticios)
        run: npm run qa:xades:preparation
      - name: Ensayo de motor XAdESjs integrado con dependencias reales (NO FISCAL)
        run: npm run qa:xades-engine
      - name: Auditar dependencias de producción (errores no ignorados)
        run: npm audit --omit=dev --audit-level=high
      - name: Compilar React/Vite
        run: npm run build

  xmlsig-independent-lab:
    name: QA independiente XMLDSig con Python
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas externas de verificación
        run: python -m pip install --disable-pip-version-check 'lxml>=5,<7' 'cryptography>=42,<47'
      - name: Comprobar validador XMLSchema (esquema mínimo sintético, NO XSD de Hacienda)
        run: python tests/qa-086-xsd-official.py --self-test
      - name: Matriz XSD FE/TE/NC/ND v4.4 (25 controles sintéticos, NO homologación)
        run: python tests/qa-087-xsd-pareja.py --self-test
      - name: Diagnóstico antes de firma FE/TE (18 casos sintéticos, no certifica Hacienda)
        run: npm run qa:xsd:pre-sign
      - name: Puente escritorio Node/Python para FE/TE (XSD sintéticos, sin envío)
        run: npm run qa:xsd:desktop-real
      - name: Contrato de la pantalla pre-firma y puente Node (sin XSD oficial)
        run: npm run qa:xsd:pre-sign-desktop
      - name: Firmar plantilla sintética (clave y certificado temporal)
        run: node -e "require('./electron/fe-xades-xml-lab.cjs').createXmlProof().then(p=>require('node:fs').writeFileSync(process.env.RUNNER_TEMP+'/facturacr-xmlsig-demo.xml',p.xml))"
      - name: Comprobar C14N, referencias, RSA-SHA256 y alteraciones con verificador externo
        run: python tests/qa-078-xmlsig-independiente.py "$RUNNER_TEMP/facturacr-xmlsig-demo.xml"
      - name: Endurecimiento de estructura y ataques a XML sintético
        run: python tests/qa-079-xmlsig-endurecimiento.py "$RUNNER_TEMP/facturacr-xmlsig-demo.xml"

      - name: Producir tres variantes XML sintéticas sin certificados reales
        run: |
          node -e "const f=require('node:fs');const lab=require('./electron/fe-xades-xml-lab.cjs');(async()=>{for(const v of ['standard','servicio','mercaderia']){const p=await lab.createXmlProof({variant:v});f.writeFileSync(process.env.RUNNER_TEMP+'/facturacr-080-'+v+'.xml',p.xml)}})().catch(e=>{console.error(e);process.exitCode=1})"
      - name: Reabrir y verificar localmente las firmas ficticias sin usar certificados reales
        run: node --no-warnings tests/qa-081-xml-verificador-local.cjs
      - name: Verificación externa de las tres estructuras y manipulaciones
        run: python tests/qa-080-xmlsig-variantes.py "$RUNNER_TEMP/facturacr-080-standard.xml" "$RUNNER_TEMP/facturacr-080-servicio.xml" "$RUNNER_TEMP/facturacr-080-mercaderia.xml"
